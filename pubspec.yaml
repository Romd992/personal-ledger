name: ledger
description: "简帐 - Flutter原生版"
publish_to: 'none'
version: 1.0.4+1001

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.0
  path: ^1.9.0
  path_provider: ^2.1.4
  fl_chart: ^0.68.0
  excel: ^4.0.3
  csv: ^6.0.0
  file_picker: ^8.1.2
  share_plus: ^10.0.2
  http_server: ^1.0.0
  network_info_plus: ^6.0.2
  crypto: ^3.0.5
  pointycastle: ^3.7.4
  shared_preferences: ^2.3.2
  package_info_plus: ^8.0.2
  permission_handler: ^11.3.1
  image_picker: ^1.1.2
  intl: ^0.19.0
  uuid: ^4.5.1
  url_launcher: ^6.3.0
  http: ^1.2.0
  pdf: ^3.11.1
  image: ^4.2.0
  # 蓝牙互传（暂注释，兼容性问题后续解决）
  # flutter_blue_plus: ^1.32.13
  android_intent_plus: ^4.0.3
  open_filex: ^4.4.0
  archive: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
